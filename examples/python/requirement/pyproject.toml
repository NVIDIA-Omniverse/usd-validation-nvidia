[project]
name = "usd-validation-requirement-plugin"
version = "0.1.0"
description = "Minimal NVIDIA USD Validation requirement-backed plugin example"
requires-python = ">=3.10,<3.13"
dependencies = [
    "usd-validation-nvidia[usd]",
]

[project.entry-points."usd_validation_nvidia"]
requirement_example = "main:Plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
artifacts = [
    "example_requirements",
]

[tool.hatch.build.targets.wheel]
only-include = ["main.py"]

# Force the generated package into the wheel so missing codegen fails at build time.
[tool.hatch.build.targets.wheel.force-include]
"example_requirements" = "example_requirements"
