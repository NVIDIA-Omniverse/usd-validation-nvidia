include:
  - project: 'omniverse/devplat/gitlab/templates/common/compliance'
    file: 'modules/omniverse-repo-compliance.gitlab-ci.yml'
    ref: v1_latest
  - project: 'omniverse/devplat/gitlab/templates/runners'
    file: 'modules/include.yml'
    ref: v3_latest
  - project: 'omniverse/sectools/vault'
    file:
      - 'templates/v3/linux/packman_s3.gitlab-ci.yml'
      - 'templates/v3/linux/artifactory.gitlab-ci.yml'
  - project: 'omniverse/devplat/gitlab/templates/common/github-mirror-control'
    file: 'templates/candidate-pipeline.yml'
    ref: v1_latest

variables:
  MIRROR_REPO_ID: "usd-validation-nvidia"
  OSEC_CHECKMARX_ENABLED: false
  OSEC_SONARQUBE_ENABLED: true
  SONARQUBE_PROJECT_KEY: "SimTech_Omniverse_Omniverse_omniverse-usd-rels-usd-validation-nvidia"

.default-rules:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_REF_PROTECTED == "true"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "parent_pipeline"
    - if: $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "web"

.long-queue-rules:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_REF_PROTECTED == "true"
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "parent_pipeline"
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true

workflow:
  rules:
    - !reference [.default-rules, rules]

stages:
  - check
  - build
  - test
  - deploy

# ==============================================================================================================
# Common Templates
# ==============================================================================================================

.repo-artifacts:
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - _repo/repo.log
      - _repo/repolog*.txt

# ==============================================================================================================
# Pre-build Checks
# ==============================================================================================================

check-lint:
  stage: check
  extends:
    - .repo-artifacts
    - .ipp_lnx_x86_64_cpu_micro
  allow_failure: false
  needs: []
  script:
    - |
      if ! ./repo.sh lint --help &> /dev/null
      then
          echo -e "${RED}repo_lint is not installed${RED_RESET}"
          exit 1
      fi
    - |
      if [[ "$CI_PIPELINE_SOURCE" == "merge_request_event" ]]
      then
        echo "Lint the commits \"${CI_MERGE_REQUEST_DIFF_BASE_SHA}..${CI_COMMIT_SHA}\""
        while ! git log | grep "${CI_MERGE_REQUEST_DIFF_BASE_SHA}"; do
          git fetch --deepen=3
        done
      fi
    - ./repo.sh lint all -m

check-version:
  stage: check
  extends:
    - .ipp_lnx_x86_64_cpu_micro
  needs: []
  script:
    - echo "VERSION=v$(cat VERSION.md)" > dotenv.env
    - echo "VERSION_NUMBER=$(cat VERSION.md)" >> dotenv.env
    - cat dotenv.env
  artifacts:
    reports:
      dotenv: dotenv.env

# ==============================================================================================================
# Build Jobs
# ==============================================================================================================

.build-capabilities-linux:
  script:
    - |
      ./repo.sh uv -- run \
        --no-project \
        --index https://urm.nvidia.com/artifactory/api/pypi/ct-omniverse-pypi-local/simple \
        --with usd-profiles-nvidia==1.14.1 \
        python -m usd_profiles_nvidia.codegen \
          --docs-root specs \
          --destination-dir src \
          --package-name usd_validation_nvidia.capabilities

.build-capabilities-windows:
  script:
    - >
      .\repo.bat uv -- run
      --no-project
      --index https://urm.nvidia.com/artifactory/api/pypi/ct-omniverse-pypi-local/simple
      --with usd-profiles-nvidia==1.14.1
      python -m usd_profiles_nvidia.codegen
      --docs-root specs
      --destination-dir src
      --package-name usd_validation_nvidia.capabilities

build-package-linux-x86_64:
  stage: build
  needs:
    - job: build-pip
      artifacts: true
  extends:
    - .ipp_lnx_x86_64_cpu_medium
  variables:
    OMNI_REPO_BUILD_NO_DOCKER: "1"
  script:
    - !reference [.build-capabilities-linux, script]
    - ./repo.sh package -m usd_validation_nvidia -c release
  artifacts:
    paths:
      - _build/packages

build-package-linux-aarch64:
  stage: build
  needs:
    - job: build-pip
      artifacts: true
  extends:
    - .runner-build-linux-aarch64
  rules:
    - !reference [.long-queue-rules, rules]
  variables:
    OMNI_REPO_BUILD_NO_DOCKER: "1"
  script:
    - !reference [.build-capabilities-linux, script]
    - ./repo.sh package -m usd_validation_nvidia -c release
  artifacts:
    paths:
      - _build/packages

build-package-windows-x86_64:
  stage: build
  needs:
    - job: build-pip
      artifacts: true
  extends:
    - .runner-build-windows-x86_64
  script:
    - !reference [.build-capabilities-windows, script]
    - .\repo.bat package -m usd_validation_nvidia -c release
  artifacts:
    paths:
      - _build/packages

build-pip:
  stage: build
  needs: []
  extends:
    - .ipp_lnx_x86_64_cpu_medium
  script:
    - !reference [.build-capabilities-linux, script]
    - ./repo.sh uv -- build -o dist
  artifacts:
    paths:
      - dist

# ==============================================================================================================
# Test Jobs
# ==============================================================================================================

osec:sonarqube:
  variables:
    SONAR_EXCLUSIONS: "_build/**,_repo/**,tools/**,tests/**"

test-pip:
  stage: test
  extends:
    - .ipp_lnx_x86_64_cpu_medium
  needs:
    - job: build-pip
      artifacts: true
  parallel:
    matrix:
      - USD_VERSION: ["23.11", "24.05", "25.05", "25.11", "26.03"]
        NUMPY_VERSION: ["", "1.24", "2.2"]
  script:
    - |
      NUMPY_ARG=""
      [ -n "$NUMPY_VERSION" ] && NUMPY_ARG="--with numpy==$NUMPY_VERSION"
      ./repo.sh uv -- run \
        --no-project \
        --with ./dist/usd_validation_nvidia-*.whl \
        --with usd-core==$USD_VERSION \
        $NUMPY_ARG \
        python -m unittest discover -s tests

test-coverage-data:
  stage: test
  extends:
    - .ipp_lnx_x86_64_cpu_medium
  needs: []
  parallel:
    matrix:
      - USD_VERSION: ["23.11", "24.05", "25.05", "25.11", "26.03"]
        NUMPY_VERSION: ["", "1.24", "2.2"]
  variables:
    COVERAGE_FILE: ".coverage-data/.coverage.usd-${USD_VERSION}.numpy-${NUMPY_VERSION}"
  script:
    - !reference [.build-capabilities-linux, script]
    - |
      NUMPY_ARG=""
      [ -n "$NUMPY_VERSION" ] && NUMPY_ARG="--with numpy==$NUMPY_VERSION"
      mkdir -p .coverage-data
      ./repo.sh uv -- run \
        --with coverage \
        --with usd-core==$USD_VERSION \
        $NUMPY_ARG \
        --with-editable . \
        coverage run --parallel-mode \
          --source=src \
          --omit="src/usd_validation_nvidia/capabilities/*" \
          -m unittest discover -s tests
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - .coverage-data/

test-coverage:
  stage: test
  extends:
    - .ipp_lnx_x86_64_cpu_medium
  needs:
    - job: test-coverage-data
      artifacts: true
  script:
    - |
      ./repo.sh uv -- run --no-project --with coverage coverage combine .coverage-data
      ./repo.sh uv -- run --no-project --with coverage coverage report -m | tee coverage-report.txt
      ./repo.sh uv -- run --no-project --with coverage coverage xml -o coverage.xml
  coverage: '/^TOTAL\s+.*\s(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - coverage-report.txt
      - coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

test-skills-nvbase:
  stage: test
  extends:
    - .ipp_lnx_x86_64_cpu_medium
  needs: []
  script:
    - mkdir -p reports/nvbase
    - >
      ./repo.sh uv -- run
      --no-project
      --python 3.12
      --index https://urm.nvidia.com/artifactory/api/pypi/nv-shared-pypi/simple
      --with nv-base
      nv-base validate .
      --no-dedup
      --external
      --type skill
      -r cli html
      -o reports/nvbase
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - reports/nvbase/

# ==============================================================================================================
# Publish Jobs
# ==============================================================================================================

publish-cloudfront:
  stage: deploy
  extends:
    - .ipp_lnx_x86_64_cpu_micro
    - .osec:vault:v3:prod_token_job
  needs:
    - job: build-package-linux-x86_64
      artifacts: true
    - job: build-package-linux-aarch64
      artifacts: true
    - job: build-package-windows-x86_64
      artifacts: true
    - job: test-pip
      artifacts: false
    - job: test-coverage
      artifacts: false
  before_script:
    - !reference [.osec:vault:v3:linux, packman_s3:perform_vault_requests]
  script:
    - ./repo.sh publish
  rules:
    - if: $CI_COMMIT_TAG

publish-pip-artifactory:
  stage: deploy
  extends:
    - .ipp_lnx_x86_64_cpu_micro
    - .osec:vault:v3:prod_token_job
  needs:
    - job: build-pip
      artifacts: true
    - job: test-pip
      artifacts: false
    - job: test-coverage
      artifacts: false
  before_script:
    - !reference [.osec:vault:v3:linux, artifactory:perform_vault_requests]
  variables:
    ARTIFACTORY_URL: https://urm.nvidia.com/artifactory/api/pypi/ct-omniverse-pypi
  script:
    - ./repo.sh uv -- publish --publish-url $ARTIFACTORY_URL --username $ARTIFACTORY_USERNAME --password $ARTIFACTORY_KEY dist/*.whl
  rules:
    - if: $CI_COMMIT_TAG

publish-pip-kitmaker:
  stage: deploy
  extends:
    - .ipp_lnx_x86_64_cpu_micro
  needs:
    - job: build-pip
      artifacts: true
    - job: publish-pip-artifactory
      artifacts: false
  script:
    - ./repo.sh uv -- run tools/ci/publish_wheel.py --wheel-dir dist
  manual_confirmation: "This will upload the wheel externally, are you sure you want to proceed?"
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true

# ==============================================================================================================
# Release Jobs
# ==============================================================================================================

release_job:
  stage: deploy
  extends:
    - .ipp_lnx_x86_64_cpu_micro
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: check-version
      artifacts: true
    - job: test-pip
      artifacts: false
    - job: test-coverage
      artifacts: false
  script:
    - echo "Creating release"
  release:
    name: 'USD Validation NVIDIA ${VERSION}'
    description: CHANGELOG.md
    tag_name: '${VERSION}'
    ref: '$CI_COMMIT_SHA'
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "parent_pipeline"
      when: never
    - if: $CI_COMMIT_REF_PROTECTED == "true"
      changes:
        - VERSION.md
