[project]
name = "usd-validation-validate-references-plugin"
version = "0.1.0"
description = "USD Validation NVIDIA requirement and feature reference example"
requires-python = ">=3.10,<3.15"
dependencies = [
    "usd-validation-nvidia[usd]>=1.20.0",
]

[project.entry-points."usd_validation_nvidia"]
validate_references_example = "main:Plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
artifacts = [
    "example_validate_references",
]

[tool.hatch.build.targets.wheel]
only-include = ["main.py"]

# Force the generated package into the wheel so missing codegen fails at build time.
[tool.hatch.build.targets.wheel.force-include]
"example_validate_references" = "example_validate_references"
