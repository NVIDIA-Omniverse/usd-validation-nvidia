[project]
name = "usd-validation-nvidia"
dynamic = ["version"]
description = "USD Validation NVIDIA"
authors = [
    {name = "NVIDIA"},
]
license = {text = "Apache-2.0 AND CC-BY-4.0"}
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
readme = "README.md"
requires-python = ">=3.10,<3.15"

[project.urls]
Repository = "https://github.com/NVIDIA-Omniverse/usd-validation-nvidia"
Changelog = "https://github.com/NVIDIA-Omniverse/usd-validation-nvidia/blob/main/validation/CHANGELOG.md"
Documentation = "https://nvidia-omniverse.github.io/usd-validation-nvidia/"

[project.optional-dependencies]
usd = [
    "usd-core>=23.11; python_version < '3.14'",
    "usd-core>=26.08,<26.09; python_version == '3.14'",
]
numpy = ["numpy>=1,<3"]

[tool.hatch.version]
path = "../VERSION.md"
pattern = "^(?P<version>.+)$"

[project.scripts]
nvidia_usd_validate = "usd_validation_nvidia:cli_main"

[project.entry-points."omni.asset_validator"]
default = "usd_validation_nvidia:DefaultPlugin"

[tool.hatch.build]
artifacts = [
    "src/usd_validation_nvidia/capabilities",
]

[tool.hatch.build.targets.sdist.force-include]
"../LICENSE" = "LICENSE"
"../THIRD_PARTY_NOTICES.md" = "THIRD_PARTY_NOTICES.md"

[tool.hatch.build.targets.wheel]
packages = ["src/usd_validation_nvidia", "src/omni"]

[build-system]
requires = ["hatchling"] # SWIPAT filed under: http://nvbugs/5866335
build-backend = "hatchling.build"
